name: caribu
channels:
  - openalea3/label/dev
  - openalea3/label/rc
  - openalea3
  - conda-forge
dependencies:
  - python
  - pandoc
  # the component's platform; brings numpy, scipy, pandas, numba, pyyaml, openalea.mtg and openalea.encoding3d.
  # Adel's port for the component's test on its canopies (optional, skipped without it):
  #   pip install -e ../adel --no-deps
  - openalea.metafspm
  # the legacy (openalea.caribu.legacy) and the comparisons: the C++ executables and PlantGL's scenes
  - openalea.libcaribu
  - openalea.plantgl
  - openalea.widgets
  # drawings, tests, the tutorial
  - matplotlib-base
  - pytest
  - jupyter
  - nbconvert
  # GPU (optional, not needed): numba's CUDA target needs a CUDA toolkit, e.g.
  #   - cuda-nvcc
  #   - cuda-nvrtc
  - pip
  - pip:
      - -e ..[doc,test]
