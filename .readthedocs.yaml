version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "miniconda3-3.12-24.9"

  jobs:
    pre_install:
      - export PREFIX=$CONDA_PREFIX
      - pip install -e .[doc]

conda:
  environment: conda/python_dev_env.yml

sphinx:
  # Path to your Sphinx configuration file.
  configuration: doc/conf.py
