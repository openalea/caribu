[build-system]
requires = ["scikit-build-core", "setuptools", "setuptools-scm"]
build-backend = "scikit_build_core.setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst"]}

# enable dynamic version based on git tags
[tool.setuptools_scm]
# Configure to align with the one of meta.yaml
fallback_version = "0.0.0.dev0"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.scikit-build]
build-dir = "./build/{wheel_tag}"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
logging.level = "WARNING"
build.verbose = true

[tool.scikit-build.cmake]
build-type = "Release"
source-dir = "."

[project]
name = "openalea.caribu"
authors = [
  { name = "Christian Fournier"},
  { name = "Michael Chelle"},
  { name = "Christophe Pradal"},
]
description = "Simulation of light interception by plants"
license = "CECILL-C"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.10"
keywords = ["openalea", "FSPM", "light"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version", "readme"]
dependencies = [
  "numpy"
]

[project.optional-dependencies]
test = [
  "pytest",
  "nbmake"
]
doc = [
  "pydata-sphinx-theme",
  "myst-parser",
  "sphinx-favicon",
  "nbsphinx",
  "ipykernel",
  "sphinx-copybutton",
  "ipython_genutils",
  "pandoc",
]

[project.urls]
Homepage = "https://openalea.readthedocs.io/"
"Bug Tracker" = "https://github.com/openalea/caribu/issues"
Discussions = "https://github.com/openalea/caribu/discussions"
Changelog = "https://github.com/openalea/caribu/releases"

[project.entry-points."wralea"]
"openalea.caribu" = "openalea.caribu_wralea"

[tool.conda.environment]
channels = [
  "openalea3",
  "conda-forge"
]
dependencies = [
  "matplotlib-base",
  "openalea.plantgl"
]
test_dependencies = [
  "openalea.mtg"
]

[tool.conda.environment.optional-dependencies]
viz= [
  "oawidgets"
]

